<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;width:1280px;height:800px;overflow:hidden}
body{background:linear-gradient(160deg,#4A3521 0%,#2a1d12 55%,#1D140D 100%);font-family:-apple-system,BlinkMacSystemFont,sans-serif;color:#fff;display:flex;align-items:center}
.copy{width:560px;padding-left:96px}
.copy img{width:104px;height:104px;margin-left:-8px}
h1{font-size:56px;font-weight:700;letter-spacing:-1px;margin:18px 0 14px;background:linear-gradient(180deg,#FFC86C,#EE8526);-webkit-background-clip:text;color:transparent}
p{font-size:24px;line-height:1.45;color:#eadccb;margin:0 0 22px}
p.small{font-size:17px;color:#b9a48c}
.popup{margin-left:70px;width:340px;height:auto;border:none;border-radius:14px;box-shadow:0 30px 80px rgba(0,0,0,.55),0 0 0 1px rgba(255,255,255,.06);transform:scale(1.12);transform-origin:left center;background:#fff}
</style></head><body>
<div class="copy">
<img src="icon.svg">
<h1>Commonplace</h1>
<p>Save the page you're reading to a running log in Apple Notes, with a link, the time and your own note.</p>
<p class="small">Select a passage before you click the icon and it's filled in for you. Everything stays on your Mac.</p>
</div>
<img class="popup" src="popup.png">
</body></html>
