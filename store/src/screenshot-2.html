<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;width:1280px;height:800px;overflow:hidden}
body{background:linear-gradient(160deg,#4A3521 0%,#2a1d12 55%,#1D140D 100%);font-family:-apple-system,BlinkMacSystemFont,sans-serif;color:#fff;display:flex;align-items:center}
.copy{width:430px;padding-left:80px;flex-shrink:0}
h1{font-size:48px;line-height:1.1;font-weight:700;letter-spacing:-1px;margin:0 0 18px;background:linear-gradient(180deg,#FFC86C,#EE8526);-webkit-background-clip:text;color:transparent}
p{font-size:23px;line-height:1.45;color:#eadccb;margin:0 0 22px}
p.small{font-size:17px;color:#b9a48c}
.shot{margin-left:50px;width:630px;border-radius:13px;box-shadow:0 30px 80px rgba(0,0,0,.55),0 0 0 1px rgba(255,255,255,.08)}
</style></head><body>
<div class="copy">
<h1>Every link, in&nbsp;your&nbsp;note</h1>
<p>Each save adds the page title as a link, the address, the time and your comment to the end of the note you picked.</p>
<p class="small">Use one note as a reading log, or keep a note per project.</p>
</div>
<img class="shot" src="notes-window.png">
</body></html>
