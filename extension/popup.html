<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <style>
            * {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
            }
            body {
                width: 340px;
                font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
                font-size: 13px;
                color: #1d1d1f;
                padding: 16px;
                background: #fff;
            }
            h1 {
                font-size: 14px;
                font-weight: 600;
                margin-bottom: 12px;
            }
            .page-info {
                background: #f5f5f7;
                border-radius: 8px;
                padding: 10px 12px;
                margin-bottom: 14px;
                line-height: 1.4;
            }
            .page-title {
                font-weight: 600;
                display: -webkit-box;
                -webkit-line-clamp: 2;
                -webkit-box-orient: vertical;
                overflow: hidden;
            }
            .page-url {
                color: #86868b;
                font-size: 11px;
                margin-top: 2px;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
            }
            label {
                display: block;
                font-weight: 500;
                margin-bottom: 4px;
                color: #6e6e73;
                font-size: 11px;
                text-transform: uppercase;
                letter-spacing: 0.5px;
            }
            select,
            textarea,
            input[type="text"] {
                width: 100%;
                border: 1px solid #d2d2d7;
                border-radius: 6px;
                padding: 8px 10px;
                font-family: inherit;
                font-size: 13px;
                margin-bottom: 12px;
                outline: none;
                transition: border-color 0.15s;
                background: #fff;
            }
            select:focus,
            textarea:focus,
            input[type="text"]:focus {
                border-color: #0071e3;
            }
            select:disabled {
                background: #f5f5f7;
                color: #86868b;
            }
            textarea {
                height: 130px;
                resize: vertical;
            }
            .row {
                display: flex;
                gap: 6px;
                align-items: center;
                margin-bottom: 12px;
            }
            .row select {
                margin-bottom: 0;
                flex: 1;
            }
            .refresh-btn {
                background: none;
                border: 1px solid #d2d2d7;
                border-radius: 6px;
                padding: 7px 8px;
                cursor: pointer;
                font-size: 14px;
                line-height: 1;
                color: #86868b;
                transition: border-color 0.15s;
                flex-shrink: 0;
            }
            .refresh-btn:hover {
                border-color: #0071e3;
                color: #0071e3;
            }
            .refresh-btn.busy {
                animation: spin 0.9s linear infinite;
                border-color: transparent;
            }
            @media (prefers-reduced-motion: reduce) {
                .refresh-btn.busy {
                    animation: none;
                    opacity: 0.4;
                }
            }
            @keyframes spin {
                to {
                    transform: rotate(360deg);
                }
            }
            .checkbox-row {
                display: flex;
                align-items: center;
                gap: 6px;
                margin-bottom: 14px;
                font-size: 12px;
                color: #6e6e73;
            }
            .checkbox-row input {
                margin: 0;
            }
            button#save,
            button#setupLink {
                width: 100%;
                padding: 10px;
                background: #0071e3;
                color: #fff;
                border: none;
                border-radius: 8px;
                font-size: 14px;
                font-weight: 500;
                cursor: pointer;
                transition: background 0.15s;
            }
            button#save:hover,
            button#setupLink:hover {
                background: #0077ed;
            }
            button#save:disabled {
                background: #d2d2d7;
                cursor: default;
            }
            .status {
                text-align: center;
                margin-top: 8px;
                font-size: 12px;
                min-height: 16px;
            }
            .status.ok {
                color: #248a3d;
            }
            .status.err {
                color: #ff3b30;
            }
            .status.loading {
                color: #86868b;
            }
            .kbd {
                opacity: 0.7;
                font-size: 12px;
                margin-left: 6px;
            }
            .setup p {
                line-height: 1.45;
                margin-bottom: 12px;
            }
            .setup .muted {
                color: #86868b;
                font-size: 11px;
                margin: 10px 0 0;
                user-select: text;
            }
        </style>
    </head>
    <body>
        <h1>Save to Apple Notes</h1>

        <section class="setup" id="setup" hidden>
            <p id="setupText">
                Commonplace needs a small helper app on your Mac to read and write Apple Notes. It isn't installed
                yet, or it was set up for a different copy of the extension.
            </p>
            <button id="setupLink">Set up the helper</button>
            <p class="muted">Extension ID: <span id="extId"></span></p>
        </section>

        <main id="form">
            <div class="page-info">
                <div class="page-title" id="pageTitle">Loading…</div>
                <div class="page-url" id="pageUrl"></div>
            </div>

            <label for="folderSelect">Folder</label>
            <div class="row">
                <select id="folderSelect">
                    <option value="">Loading…</option>
                </select>
                <button class="refresh-btn" id="refresh" title="Refresh note list">↻</button>
            </div>

            <label for="noteSelect">Note</label>
            <select id="noteSelect" disabled>
                <option value="">Select a folder first</option>
            </select>

            <label for="comment">Quick note</label>
            <textarea id="comment" placeholder="Add a few words about this page…"></textarea>

            <div class="checkbox-row">
                <input type="checkbox" id="stripQuery" checked />
                <label
                    for="stripQuery"
                    style="margin: 0; text-transform: none; font-size: 12px; color: #6e6e73; letter-spacing: 0"
                    >Remove tracking parameters from link</label
                >
            </div>

            <button id="save" disabled>Save to Notes<span class="kbd">⌘↩</span></button>
            <div class="status" id="status" role="status" aria-live="polite"></div>
        </main>

        <script src="popup.js"></script>
    </body>
</html>
