<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <style>
            /* Palette from the Commonplace icon: warm browns with an orange gradient accent */
            :root {
                color-scheme: light dark;
                --bg: #fffcf8;
                --surface: #f6efe6;
                --field: #ffffff;
                --border: #e2d6c7;
                --text: #2a1d12;
                --muted: #8a7663;
                --label: #7a6552;
                --accent: #e07b1f;
                --accent-gradient: linear-gradient(180deg, #ffc86c, #ee8526);
                --on-accent: #2a1d12;
                --ok: #2e7d32;
                --err: #c62828;
            }
            @media (prefers-color-scheme: dark) {
                :root {
                    --bg: #241910;
                    --surface: #33251a;
                    --field: #2c2016;
                    --border: #4a3828;
                    --text: #f3e8da;
                    --muted: #b59e86;
                    --label: #a88f76;
                    --accent: #f5a24a;
                    --ok: #81c784;
                    --err: #ef8a80;
                }
            }
            * {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
            }
            body {
                width: 340px;
                font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
                font-size: 13px;
                color: var(--text);
                padding: 16px;
                background: var(--bg);
                accent-color: var(--accent);
            }
            h1 {
                font-size: 14px;
                font-weight: 600;
                margin-bottom: 12px;
            }
            .page-info {
                background: var(--surface);
                border-radius: 8px;
                padding: 10px 12px;
                margin-bottom: 14px;
                line-height: 1.4;
            }
            .page-title {
                font-weight: 600;
                display: -webkit-box;
                -webkit-line-clamp: 2;
                -webkit-box-orient: vertical;
                overflow: hidden;
            }
            .page-url {
                color: var(--muted);
                font-size: 11px;
                margin-top: 2px;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
            }
            label {
                display: block;
                font-weight: 500;
                margin-bottom: 4px;
                color: var(--label);
                font-size: 11px;
                text-transform: uppercase;
                letter-spacing: 0.5px;
            }
            select,
            textarea,
            input[type="text"] {
                width: 100%;
                border: 1px solid var(--border);
                border-radius: 6px;
                padding: 8px 10px;
                font-family: inherit;
                font-size: 13px;
                color: var(--text);
                margin-bottom: 12px;
                outline: none;
                transition: border-color 0.15s, box-shadow 0.15s;
                background: var(--field);
            }
            select:focus,
            textarea:focus,
            input[type="text"]:focus {
                border-color: var(--accent);
                box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent);
            }
            select:disabled {
                background: var(--surface);
                color: var(--muted);
            }
            textarea {
                height: 130px;
                resize: vertical;
            }
            textarea::placeholder {
                color: var(--muted);
            }
            .row {
                display: flex;
                gap: 6px;
                align-items: center;
                margin-bottom: 12px;
            }
            .row select {
                margin-bottom: 0;
                flex: 1;
            }
            .refresh-btn {
                background: none;
                border: 1px solid var(--border);
                border-radius: 6px;
                padding: 7px 8px;
                cursor: pointer;
                font-size: 14px;
                line-height: 1;
                color: var(--muted);
                transition: border-color 0.15s, color 0.15s;
                flex-shrink: 0;
            }
            .refresh-btn:hover {
                border-color: var(--accent);
                color: var(--accent);
            }
            .refresh-btn.busy {
                animation: spin 0.9s linear infinite;
                border-color: transparent;
            }
            @media (prefers-reduced-motion: reduce) {
                .refresh-btn.busy {
                    animation: none;
                    opacity: 0.4;
                }
            }
            @keyframes spin {
                to {
                    transform: rotate(360deg);
                }
            }
            .checkbox-row {
                display: flex;
                align-items: center;
                gap: 6px;
                margin-bottom: 14px;
            }
            .checkbox-row input {
                margin: 0;
            }
            .checkbox-row label {
                margin: 0;
                text-transform: none;
                font-size: 12px;
                font-weight: 400;
                letter-spacing: 0;
            }
            button#save,
            button#setupLink {
                width: 100%;
                padding: 10px;
                background: var(--accent-gradient);
                color: var(--on-accent);
                border: none;
                border-radius: 8px;
                font-size: 14px;
                font-weight: 600;
                cursor: pointer;
                transition: filter 0.15s;
            }
            button#save:hover,
            button#setupLink:hover {
                filter: brightness(1.05);
            }
            button#save:focus-visible,
            button#setupLink:focus-visible {
                outline: 2px solid var(--accent);
                outline-offset: 2px;
            }
            button#save:disabled {
                background: var(--surface);
                color: var(--muted);
                filter: none;
                cursor: default;
            }
            .status {
                text-align: center;
                margin-top: 8px;
                font-size: 12px;
                min-height: 16px;
            }
            .status.ok {
                color: var(--ok);
            }
            .status.err {
                color: var(--err);
            }
            .status.loading {
                color: var(--muted);
            }
            .kbd {
                opacity: 0.65;
                font-size: 12px;
                font-weight: 500;
                margin-left: 6px;
            }
            .setup p {
                line-height: 1.45;
                margin-bottom: 12px;
            }
            .setup .muted {
                color: var(--muted);
                font-size: 11px;
                margin: 10px 0 0;
                user-select: text;
            }
        </style>
    </head>
    <body>
        <h1>Save to Apple Notes</h1>

        <section class="setup" id="setup" hidden>
            <p id="setupText">
                Commonplace saves to Apple Notes through Commonplace Helper, a small Mac app. Install it and open it
                once, then try again.
            </p>
            <button id="setupLink">Get Commonplace Helper</button>
            <p class="muted">Extension ID: <span id="extId"></span></p>
        </section>

        <main id="form">
            <div class="page-info">
                <div class="page-title" id="pageTitle">Loading…</div>
                <div class="page-url" id="pageUrl"></div>
            </div>

            <label for="folderSelect">Folder</label>
            <div class="row">
                <select id="folderSelect">
                    <option value="">Loading…</option>
                </select>
                <button class="refresh-btn" id="refresh" title="Refresh note list">↻</button>
            </div>

            <label for="noteSelect">Note</label>
            <select id="noteSelect" disabled>
                <option value="">Select a folder first</option>
            </select>

            <label for="comment">Quick note</label>
            <textarea id="comment" placeholder="Add a few words about this page…"></textarea>

            <div class="checkbox-row">
                <input type="checkbox" id="stripQuery" checked />
                <label for="stripQuery">Remove tracking parameters from link</label>
            </div>

            <button id="save" disabled>Save to Notes<span class="kbd">⌘↩</span></button>
            <div class="status" id="status" role="status" aria-live="polite"></div>
        </main>

        <script src="popup.js"></script>
    </body>
</html>
